name: CI/CD Pipeline Examen Banda

on:
  push:
    branches: [ "banda" ]

env:
  IMAGE_NAME: examen-cicd-banda
  TAG: 1.0.5

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest

      - name: Ejecutar Pruebas (CI)
        run: |
          pytest test_app.py

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y Publicar Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Despliegue en VPS via SSH (Modo Swarm)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }} # Puerto 1001
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            mkdir -p ~/examen_banda
            cd ~/examen_banda
            
            # Limpieza preventiva
            rm -f docker-compose.yml || true
            
            # --- GENERACIÓN DEL STACK BLINDADO CONTRA ERRORES DE COMILLAS ---
            # Usamos una variable para el host para evitar problemas de escape complejos
            export HOST_RULE='Host(`banda.byronrm.com`)'
            
            cat <<EOF > stack.yml
            version: '3.8'
            services:
              web:
                image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
                deploy:
                  replicas: 1
                  restart_policy:
                    condition: on-failure
                  labels:
                    - "traefik.enable=true"
                    # HTTP -> HTTPS Redirect
                    - "traefik.http.routers.banda-final.entrypoints=http"
                    - "traefik.http.routers.banda-final.rule=\$HOST_RULE"
                    - "traefik.http.middlewares.banda-https-redirect.redirectscheme.scheme=https"
                    - "traefik.http.routers.banda-final.middlewares=banda-https-redirect"
                    # HTTPS Config
                    - "traefik.http.routers.banda-final-secure.entrypoints=https"
                    - "traefik.http.routers.banda-final-secure.rule=\$HOST_RULE"
                    - "traefik.http.routers.banda-final-secure.tls=true"
                    # Usamos 'http' como resolver (Basado en el ejemplo de Jordy)
                    - "traefik.http.routers.banda-final-secure.tls.certresolver=http"
                    - "traefik.http.routers.banda-final-secure.service=banda-service"
                    - "traefik.http.services.banda-service.loadbalancer.server.port=5000"
                    - "traefik.docker.network=traefik-public"
                networks:
                  - traefik-public
            
            networks:
              traefik-public:
                external: true
                name: traefik-public
            EOF
            
            # --- DEBUG: Muestra el archivo generado en los logs de GitHub para verificar ---
            echo "--- VERIFICANDO ARCHIVO STACK.YML ---"
            cat stack.yml
            echo "-------------------------------------"

            # --- DESPLIEGUE ---
            docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            
            # Limpiar stack viejo
            docker stack rm banda_stack || true
            sleep 15
            
            # Desplegar nuevo
            docker stack deploy --with-registry-auth -c stack.yml banda_stack