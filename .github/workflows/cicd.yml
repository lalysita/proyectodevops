name: CI/CD Pipeline Examen Banda

on:
  push:
    branches: [ "banda" ]

env:
  IMAGE_NAME: examen-cicd-banda
  TAG: 1.0.5

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest

      - name: Ejecutar Pruebas (CI)
        run: |
          pytest test_app.py

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y Publicar Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Despliegue en VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            # 1. Login Docker
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Preparar directorio
            mkdir -p ~/examen_banda
            cd ~/examen_banda
            
            # 3. Crear docker-compose (Con red traefik-public y sin entrypoints forzados)
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              web:
                image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
                container_name: examen_banda_container
                restart: always
                expose:
                  - "5000"
                networks:
                  - traefik_public
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.banda.rule=Host(\`banda.byronrm.com\`)"
                  - "traefik.http.routers.banda.tls.certresolver=myresolver"
                  - "traefik.http.services.banda.loadbalancer.server.port=5000"
                  - "traefik.docker.network=traefik-public"
            
            networks:
              traefik_public:
                external:
                  name: traefik-public
            EOF
            
            # 4. Actualizar servicio
            docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            docker compose down
            docker compose up -d