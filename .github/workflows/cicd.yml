name: CI/CD Pipeline Examen Banda

on:
  push:
    branches: [ "banda" ]

env:
  IMAGE_NAME: examen-cicd-banda
  TAG: 1.0.5

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest

      - name: Ejecutar Pruebas (CI)
        run: |
          pytest test_app.py

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y Publicar Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Despliegue en VPS via SSH (Modo Swarm)
        # Usamos la versión v1.0.0 que es la más compatible
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            mkdir -p ~/examen_banda
            cd ~/examen_banda
            
            # --- GENERAMOS EL stack.yml PARA SWARM ---
            cat <<EOF > stack.yml
            version: '3.8'
            services:
              web:
                # CAMBIO: Usamos 'latest' explícitamente como pediste
                image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
                deploy:
                  replicas: 1
                  restart_policy:
                    condition: on-failure
                  labels:
                    - "traefik.enable=true"
                    # Configuración HTTP (Redirección a HTTPS)
                    - "traefik.http.routers.banda.entrypoints=http"
                    - "traefik.http.routers.banda.rule=Host('banda.byronrm.com')"
                    - "traefik.http.middlewares.banda-https-redirect.redirectscheme.scheme=https"
                    - "traefik.http.routers.banda.middlewares=banda-https-redirect"
                    # Configuración HTTPS (Segura)
                    - "traefik.http.routers.banda-secure.entrypoints=https"
                    - "traefik.http.routers.banda-secure.rule=Host('banda.byronrm.com')"
                    - "traefik.http.routers.banda-secure.tls=true"
                    - "traefik.http.routers.banda-secure.tls.certresolver=myresolver"
                    - "traefik.http.routers.banda-secure.service=banda-service"
                    - "traefik.http.services.banda-service.loadbalancer.server.port=5000"
                    - "traefik.docker.network=traefik-public"
                networks:
                  - traefik-public
            
            networks:
              traefik-public:
                external: true
                name: traefik-public
            EOF
            
            # --- DESPLIEGUE FINAL ---
            echo "Descargando imagen latest..."
            # CAMBIO: Pull de latest
            docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            
            # Limpiamos el stack viejo
            docker stack rm banda_stack || true
            
            # Esperamos 10 segundos
            sleep 10
            
            # Desplegamos el Stack
            docker stack deploy --with-registry-auth -c stack.yml banda_stack